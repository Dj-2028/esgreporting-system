# Local development stack: MongoDB single-node replica set (transactions) + MailHog.
# Usage: docker compose up -d mongo mailhog   (api: docker compose up api)
services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) {
        rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/esg?replicaSet=rs0&directConnection=true
      SMTP_HOST: mailhog
    ports:
      - '5000:5000'
    depends_on:
      mongo:
        condition: service_healthy
      mailhog:
        condition: service_started
    profiles: ['api']

volumes:
  mongo-data:

